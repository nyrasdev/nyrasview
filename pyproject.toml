[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nyrasview"
version = "2.0.0"
description = "Monitor and orchestrate your AI coding agents: Claude Code, Codex, Gemini, opencode, Kimi, Antigravity, OpenRouter and more"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["psutil>=5.9"]
license = { text = "MIT" }

[project.scripts]
nyrasview = "nyrasview.cli:main"

[tool.setuptools]
packages = ["nyrasview"]

[tool.setuptools.package-data]
nyrasview = ["static/*"]
