[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nyrasview"
version = "2.0.0"
description = "Control center for AI-driven development: see, steer and coordinate your AI coding agents (Claude Code, Codex, Gemini, opencode, local models and more)"
readme = "README.md"
requires-python = ">=3.11"
classifiers = ["Operating System :: POSIX :: Linux", "Operating System :: Microsoft :: Windows", "Operating System :: MacOS"]
dependencies = ["psutil>=5.9", "windows-curses>=2.3; sys_platform == 'win32'"]
license = { text = "MIT" }

[project.scripts]
nyrasview = "nyrasview.cli:main"

[tool.setuptools]
packages = ["nyrasview"]

[tool.setuptools.package-data]
nyrasview = ["static/*"]
