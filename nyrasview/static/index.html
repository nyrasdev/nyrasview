<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0b0f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg">
<link rel="apple-touch-icon" href="/icon.svg">
<title>nyrasview</title>
<style>
:root{
  color-scheme:dark;
  --s1:#3987e5;--s2:#d95926;--s3:#199e70;--s4:#c98500;--s5:#d55181;--s6:#008300;--s7:#9085e9;--s8:#e66767;--other:#6e6e78;
  --bg:#0b0b0f;--panel:#121217;--panel2:#18181f;--line:#27272a;--branch:#3f3f46;--text:#f5f5f5;--dim:#8e8e99;
  --accent:#f5f5f5;--brand:#e879f9;--good:#22c55e;--bad:#ef4444;--warn:#f59e0b;--cyan:#67e8f9;
  --mono:ui-monospace,"JetBrains Mono","Fira Code",Menlo,monospace;
  --spring:cubic-bezier(.34,1.56,.64,1);--ease:cubic-bezier(.22,1,.36,1);
}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){color-scheme:light;
  --bg:#f7f7f8;--panel:#ffffff;--panel2:#f1f1f4;--line:#e4e4e7;--branch:#d4d4d8;--text:#0b0b0f;--dim:#6b6b76;
  --accent:#0b0b0f;--brand:#a21caf;--good:#16a34a;--bad:#dc2626;--warn:#d97706;--cyan:#0e7490;--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--s4:#eda100;--s5:#e87ba4;--s6:#008300;--s7:#6250d6;--s8:#e34948;--other:#a1a1aa;}}
:root[data-theme="light"]{color-scheme:light;--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--s4:#eda100;--s5:#e87ba4;--s6:#008300;--s7:#6250d6;--s8:#e34948;--other:#a1a1aa;--bg:#f7f7f8;--panel:#ffffff;--panel2:#f1f1f4;--line:#e4e4e7;--branch:#d4d4d8;--text:#0b0b0f;--dim:#6b6b76;
  --accent:#0b0b0f;--brand:#a21caf;--good:#16a34a;--bad:#dc2626;--warn:#d97706;--cyan:#0e7490;}
*{box-sizing:border-box;scrollbar-width:thin;scrollbar-color:var(--branch) transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}
.sc.quiet .box,.sc.quiet .box svg path,.sc.quiet .t{animation:none!important;transition:none!important}
.app{display:grid;grid-template-columns:260px 1fr;min-height:100vh}
aside{scrollbar-width:thin;scrollbar-color:var(--line) transparent;position:sticky;top:0;height:100vh;overflow:auto;border-right:1px solid var(--line);padding:18px 10px 18px 10px;display:flex;flex-direction:column;gap:14px}
.brand{font-weight:800;font-size:19px;letter-spacing:.2px;padding:0 10px;display:flex;align-items:center;gap:8px}
.brand span{color:var(--brand)}
.brand .beat{width:8px;height:8px;border-radius:50%;background:var(--brand);box-shadow:0 0 0 0 var(--brand);animation:beat 2.4s var(--ease) infinite}
@keyframes beat{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--brand) 60%,transparent)}70%{box-shadow:0 0 0 9px transparent}100%{box-shadow:0 0 0 0 transparent}}
.sys{padding:0 10px;font-family:var(--mono);font-size:11.5px;color:var(--dim);display:grid;gap:5px}
.meter{height:3px;border-radius:2px;background:var(--panel2);overflow:hidden}
.meter i{display:block;height:100%;background:var(--text);opacity:.55;transition:width .9s var(--ease)}
.foot{margin-top:auto;padding:0 10px;display:flex;gap:8px;align-items:center;color:var(--dim);font-size:12px}

.bm{--row:36px;--indent:40px;--trunk:14px;user-select:none}
.bm-g{margin-bottom:2px}
.bm-h{display:flex;align-items:center;gap:8px;width:100%;height:var(--row);padding:0 10px;border:0;background:none;color:var(--dim);font:inherit;font-size:12px;font-weight:600;letter-spacing:.6px;text-transform:uppercase;border-radius:10px;cursor:pointer}
.bm-h:hover{color:var(--text);background:var(--panel2)}
.bm-h svg{transition:transform .3s var(--ease)}
.bm-g.open>.bm-h svg.chev{transform:rotate(90deg)}
.bm-f{display:grid;grid-template-rows:0fr;transition:grid-template-rows .3s var(--ease)}
.bm-g.open>.bm-f{grid-template-rows:1fr}
.bm-f>div{overflow:hidden;position:relative}
.bm-lines{position:absolute;left:0;top:0;pointer-events:none;overflow:visible}
.bm-lines path{fill:none;stroke:var(--branch);stroke-width:1.5;stroke-linecap:round;stroke-dasharray:1;stroke-dashoffset:1;transition:stroke-dashoffset .4s var(--ease),stroke .25s}
.bm-g.open .bm-lines path{stroke-dashoffset:0}
.bm-lines path.on{stroke:var(--accent)}
.bm-i{display:flex;align-items:center;gap:9px;height:var(--row);margin-left:var(--indent);padding:0 10px;border-radius:10px;color:var(--dim);cursor:pointer;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;opacity:0;transform:translateX(-6px);transition:opacity .3s var(--ease),transform .3s var(--ease),background .2s,color .2s}
.bm-g.open .bm-i{opacity:1;transform:none}
.bm-i:hover{color:var(--text);background:var(--panel2)}
.bm-i.on{color:var(--accent);background:var(--panel2);font-weight:600}
.bm-i svg{flex:none;opacity:.85}
.bm-i .n{overflow:hidden;text-overflow:ellipsis}
.bm-i .badge{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--dim);font-weight:400}

.dot{width:9px;height:9px;border-radius:50%;background:var(--c);flex:none}
.dot.live{animation:pulse 2s var(--ease) infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--c) 70%,transparent)}70%{box-shadow:0 0 0 7px transparent}100%{box-shadow:0 0 0 0 transparent}}

main{padding:26px 30px 60px;min-width:0}
.ph{display:flex;align-items:center;gap:12px;margin-bottom:20px;flex-wrap:wrap}
.ph h1{font-size:22px;margin:0;letter-spacing:-.2px}
.ph .sub{color:var(--dim);font-size:13px}
.grow{flex:1}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:15px 16px;cursor:pointer;transition:border-color .25s,transform .35s var(--spring),opacity .3s;animation:rise .5s var(--ease) both;animation-delay:calc(var(--i,0)*45ms)}
.card:hover{border-color:color-mix(in srgb,var(--c) 70%,var(--line));transform:translateY(-2px)}
.card.off{opacity:.55}
@keyframes rise{from{opacity:0;transform:translateY(8px)}}
.ch{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.ch .n{font-weight:700}
.pill{font-size:11px;padding:1px 8px;border-radius:99px;border:1px solid var(--line);color:var(--dim);transition:color .3s,border-color .3s}
.pill.live{color:var(--good);border-color:color-mix(in srgb,var(--good) 40%,transparent)}
.kv{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;font-family:var(--mono);font-size:12px}
.kv span{display:block;color:var(--dim);font-size:10px;text-transform:uppercase;letter-spacing:.6px}
.kv b{font-weight:600;font-size:13px}
svg.sp{width:100%;height:38px;display:block;margin-top:12px}
svg.sp polyline{transition:all .6s var(--ease)}
.chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:10px}
.chip{font-size:11px;font-family:var(--mono);padding:2px 8px;border-radius:7px;background:var(--panel2);color:var(--dim)}
.chip.mcp{color:var(--cyan)}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;overflow:auto;margin-bottom:16px;animation:rise .45s var(--ease) both}
h2{font-size:14px;margin:0 0 12px}
h3{font-size:11px;margin:18px 0 8px;color:var(--dim);text-transform:uppercase;letter-spacing:.7px}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th{text-align:left;color:var(--dim);font-weight:600;padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap;font-size:11.5px}
td{padding:6px 8px;border-bottom:1px solid color-mix(in srgb,var(--line) 55%,transparent);vertical-align:top}
tr{transition:background .2s}
tbody tr:hover{background:var(--panel2)}
.m{font-family:var(--mono)}
td.cmd{font-family:var(--mono);color:var(--dim);max-width:560px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
tr.mcp td{color:var(--cyan)} tr.collab td{color:var(--warn)}
.r{text-align:right}
.btn{display:inline-flex;align-items:center;gap:6px;background:var(--panel2);border:1px solid var(--line);color:var(--text);padding:6px 12px;border-radius:10px;font:inherit;font-size:12.5px;cursor:pointer;text-decoration:none;transition:border-color .2s,transform .25s var(--spring),background .2s}
.btn:hover{border-color:var(--dim)}
.btn:active{transform:scale(.96)}
.btn.pri{background:var(--text);border-color:var(--text);color:var(--bg)}
.btn.sm{padding:2px 8px;font-size:11px;border-radius:7px}
input,select,textarea{background:var(--panel2);border:1px solid var(--line);color:var(--text);border-radius:10px;padding:8px 11px;font:inherit;font-size:13px;transition:border-color .2s;min-width:0}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--dim)}
textarea{width:100%;min-height:70px;resize:vertical}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.muted{color:var(--dim)}
.empty{color:var(--dim);padding:40px;text-align:center}
.bars{display:flex;align-items:flex-end;gap:5px;height:120px;margin:10px 0}
.bars div{flex:1;background:var(--c);border-radius:4px 4px 1px 1px;min-height:2px;position:relative;opacity:.85;transform-origin:bottom;animation:grow .7s var(--ease) both;animation-delay:calc(var(--i)*30ms);transition:height .7s var(--ease)}
.bars div:hover{opacity:1}
.bars div:hover::after{content:attr(data-t);position:absolute;bottom:calc(100% + 4px);left:50%;transform:translateX(-50%);font-size:11px;background:var(--panel2);border:1px solid var(--line);padding:2px 6px;border-radius:6px;white-space:nowrap;z-index:2}
@keyframes grow{from{transform:scaleY(0)}}
.cols{display:grid;grid-template-columns:minmax(320px,430px) 1fr;gap:16px;align-items:start}

.calls{display:grid;gap:8px;margin-bottom:16px}
.cc{--s:34px;--r:10px;position:relative;display:flex;align-items:center;gap:11px;padding:6px 12px 6px 6px;border-radius:calc(var(--r) + 4px);background:var(--panel);border:1px solid var(--line);overflow:hidden;animation:rise .35s var(--ease) both}
.cc .pg{position:absolute;inset:0;width:0;background:currentColor;opacity:.08;pointer-events:none}
.cc .wash{position:absolute;inset:0;opacity:0;transition:opacity .5s var(--ease);pointer-events:none}
.cc.done .wash{background:var(--good);opacity:.14}
.cc.error .wash{background:var(--bad);opacity:.14}
.cc.error{animation:shake .45s var(--ease)}
@keyframes shake{20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}
.cc .ic{width:var(--s);height:var(--s);border-radius:var(--r);background:var(--panel2);display:grid;place-items:center;flex:none;color:var(--c);position:relative;z-index:1;transition:color .3s}
.cc.done .ic{color:var(--good)} .cc.error .ic{color:var(--bad)}
.cc .tx{position:relative;z-index:1;min-width:0;display:flex;gap:8px;align-items:baseline;flex:1}
.cc .nm{font-family:var(--mono);font-weight:600;font-size:13px;white-space:nowrap}
.cc .arg{font-family:var(--mono);font-size:12.5px;color:var(--dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cc .tm{position:relative;z-index:1;font-family:var(--mono);font-size:12px;color:var(--dim);font-variant-numeric:tabular-nums}
.cc .err{position:relative;z-index:1;font-size:11.5px;color:var(--bad);max-width:280px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cc .spin{animation:spin 1s linear infinite;transform-origin:center}
@keyframes spin{to{transform:rotate(360deg)}}

.sc{display:flex;align-items:flex-start;gap:12px;padding:10px 4px;border-bottom:1px solid color-mix(in srgb,var(--line) 55%,transparent)}
.sc:last-child{border-bottom:0}
.sc .box{--b:24px;width:var(--b);height:var(--b);border-radius:8px;border:1.5px solid var(--branch);flex:none;display:grid;place-items:center;cursor:pointer;background:transparent;transition:background .25s var(--ease),border-color .25s;padding:0;margin-top:1px}
.sc .box svg path{stroke:var(--bg);stroke-width:2.6;fill:none;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:20;stroke-dashoffset:20;transition:stroke-dashoffset .3s var(--ease) .08s}
.sc.done .box{background:var(--text);border-color:var(--text);animation:spring .5s var(--spring)}
.sc.done .box svg path{stroke-dashoffset:0}
.sc.running .box{border-color:var(--warn);border-style:dashed;animation:spin 3s linear infinite}
.sc.failed .box{border-color:var(--bad)}
@keyframes spring{0%{transform:scale(.6)}60%{transform:scale(1.12)}100%{transform:scale(1)}}
.sc .bd{min-width:0;flex:1}
.sc .t{position:relative;display:inline;font-size:13.5px;transition:opacity .4s var(--ease) .12s;background-image:linear-gradient(currentColor,currentColor);background-repeat:no-repeat;background-position:0 55%;background-size:0 1.5px}
.sc.done .t{opacity:.42;background-size:100% 1.5px;transition:opacity .4s var(--ease) .12s,background-size .45s var(--ease) .12s}
.sc .meta{display:flex;gap:8px;align-items:center;font-size:12px;margin-top:3px}
.sc .meta b{color:var(--c)}
.sc .e{font-family:var(--mono);font-size:11.5px;color:var(--bad);margin-top:4px;white-space:pre-wrap}
.sc .acts{display:flex;gap:4px;opacity:0;transition:opacity .2s}
.sc:hover .acts{opacity:1}

.doc{font-family:var(--mono);font-size:12.5px;white-space:pre-wrap;line-height:1.6;max-height:74vh;overflow:auto;background:var(--panel2);border-radius:10px;padding:16px}
.doc .hd{color:var(--text);font-weight:700}
.doc .ln{white-space:pre-wrap;min-height:1.6em}
.doc .own{border-left:2px solid var(--c);padding-left:10px;transition:border-color .4s}
.now{margin-top:12px;padding-top:10px;border-top:1px dashed var(--line);font-size:12.5px;display:grid;gap:3px;min-width:0}
.now .l{display:flex;gap:7px;align-items:center;min-width:0}
.now .l span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.now .act{font-family:var(--mono);font-size:12px;color:var(--cyan)}
.now .act.idle{color:var(--dim)}
.sess{display:grid;grid-template-columns:auto 1fr auto;gap:4px 12px;align-items:center;padding:12px 4px;border-bottom:1px solid color-mix(in srgb,var(--line) 55%,transparent)}
.sess:last-child{border-bottom:0}
.sess .ic{grid-row:span 3;width:34px;height:34px;border-radius:10px;background:var(--panel2);display:grid;place-items:center;color:var(--c)}
.sess .pj{font-weight:600}
.sess .pr,.sess .ac{grid-column:2/4;font-size:12.5px;color:var(--dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sess .ac{font-family:var(--mono);color:var(--cyan)}
.sess.idle .ac{color:var(--dim)}
.lim{display:flex;gap:8px;align-items:center;margin-top:8px;padding:7px 10px;border-radius:10px;background:color-mix(in srgb,var(--bad) 12%,transparent);color:var(--bad);font-size:12.5px;animation:rise .35s var(--ease) both}
.lim b{font-weight:600}.lim .btn{margin-left:auto}
.ho{display:flex;gap:6px;align-items:center;grid-column:2/4;margin-top:4px}
.ho select{padding:3px 8px;font-size:12px;border-radius:8px}
.typing::after{content:"▍";animation:blink 1s steps(1) infinite;margin-left:1px}
@keyframes blink{50%{opacity:0}}
.reply{white-space:pre-wrap;font-size:13.5px;line-height:1.6;background:var(--panel2);border-radius:10px;padding:14px;min-height:60px;margin-top:10px}
.ov{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:14px;grid-auto-flow:row dense}
.ov>.panel{margin:0}
.c3{grid-column:span 3}.c4{grid-column:span 4}.c5{grid-column:span 5}.c6{grid-column:span 6}.c7{grid-column:span 7}.c8{grid-column:span 8}.c12{grid-column:span 12}
@media (max-width:1200px){.c3{grid-column:span 6}.c4,.c5{grid-column:span 6}.c7,.c8{grid-column:span 12}}
@media (max-width:1000px){.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:860px){.c3,.c4,.c5,.c6,.c7,.c8{grid-column:span 12}}
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;grid-column:span 12}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 14px;cursor:pointer;display:grid;gap:2px;transition:border-color .2s,transform .3s var(--spring);animation:rise .45s var(--ease) both;animation-delay:calc(var(--i,0)*35ms);min-width:0}
.tile:hover{border-color:var(--dim);transform:translateY(-2px)}
.tile .k{font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:.6px;display:flex;gap:6px;align-items:center}
.tile .v{font-size:24px;font-weight:700;letter-spacing:-.4px;font-variant-numeric:tabular-nums;line-height:1.2}
.tile .s{font-size:12px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.panel .hd2{display:flex;align-items:baseline;gap:8px;margin-bottom:12px}
.panel .hd2 h2{margin:0}
.panel .hd2 a{margin-left:auto;font-size:12px;color:var(--dim);cursor:pointer}
.panel .hd2 a:hover{color:var(--text)}
.feed{display:grid}
.fr{display:grid;grid-template-columns:22px 150px minmax(0,1fr);gap:4px 10px;align-items:center;padding:9px 2px;border-bottom:1px solid color-mix(in srgb,var(--line) 55%,transparent);cursor:pointer;border-radius:8px}
.fr:last-child{border-bottom:0}
.fr:hover{background:var(--panel2)}
.fr .who{display:flex;gap:7px;align-items:center;font-weight:600;font-size:13px;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fr .what{min-width:0;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fr .act{grid-column:3;font-family:var(--mono);font-size:12px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fr .act.on{color:var(--text)}
.fr .st{font-size:11px;color:var(--dim);margin-left:6px;font-weight:400}
.al{display:flex;gap:10px;align-items:flex-start;padding:9px 2px;border-bottom:1px solid color-mix(in srgb,var(--line) 55%,transparent);font-size:13px}
.al:last-child{border-bottom:0}
.al .i{flex:none;width:22px;height:22px;border-radius:7px;display:grid;place-items:center;font-size:12px;font-weight:700}
.al.bad .i{background:color-mix(in srgb,var(--bad) 16%,transparent);color:var(--bad)}
.al.warn .i{background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn)}
.al.good .i{background:color-mix(in srgb,var(--good) 16%,transparent);color:var(--good)}
.al .b{min-width:0;flex:1}
.al .b small{display:block;color:var(--dim);font-size:12px}
.seg{display:flex;gap:2px;height:14px;border-radius:5px;overflow:hidden;background:var(--panel2);margin:6px 0 4px}
.seg i{display:block;height:100%;min-width:2px;transition:flex-grow .8s var(--ease)}
.seg i:first-child{border-radius:4px 0 0 4px}
.segl{display:flex;justify-content:space-between;font-size:12px;color:var(--dim);margin-top:12px}
.segl b{color:var(--text);font-weight:600}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--dim);margin-top:10px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:9px;height:9px;border-radius:3px;display:inline-block}
.legend b{color:var(--text);font-weight:600;font-variant-numeric:tabular-nums}
.stk{display:grid;grid-template-columns:44px 1fr;gap:0 8px}
.stk .ya{display:flex;flex-direction:column;justify-content:space-between;font-size:11px;color:var(--dim);text-align:right;height:150px;font-variant-numeric:tabular-nums}
.stk .plot{position:relative;height:150px;display:flex;align-items:flex-end;gap:5px;border-bottom:1px solid var(--line);background:linear-gradient(var(--line),var(--line)) 0 0/100% 1px no-repeat,linear-gradient(var(--line),var(--line)) 0 50%/100% 1px no-repeat}
.stk .col{flex:1;display:flex;flex-direction:column-reverse;gap:2px;height:100%;justify-content:flex-start;min-width:0}
.stk .col i{display:block;width:100%;transition:height .8s var(--ease)}
.stk .col i:last-child{border-radius:4px 4px 0 0}
.stk .xa{grid-column:2;display:flex;gap:5px;font-size:11px;color:var(--dim);padding-top:5px}
.stk .xa span{flex:1;text-align:center;min-width:0}
.rk{display:grid;gap:9px}

function patch(a,b){
  const ac=[...a.childNodes],bc=[...b.childNodes];
  for(let i=0;i<bc.length;i++){
    const x=ac[i],y=bc[i];
    if(!x){a.appendChild(y);continue}
    if(x.nodeType!==y.nodeType||x.nodeName!==y.nodeName||(x.nodeType===1&&x.getAttribute("data-key")!==y.getAttribute("data-key"))){a.replaceChild(y,x);continue}
    if(x.nodeType!==1){if(x.nodeValue!==y.nodeValue)x.nodeValue=y.nodeValue;continue}
    if(x.hasAttribute("data-static")) continue;
    const form=/^(INPUT|TEXTAREA|SELECT)$/.test(x.tagName);
    for(const at of [...x.attributes]) if(!y.hasAttribute(at.name)&&!(form&&at.name==="value")) x.removeAttribute(at.name);
    for(const at of [...y.attributes]) if(x.getAttribute(at.name)!==at.value&&!(form&&at.name==="value")) x.setAttribute(at.name,at.value);
    if(!form) patch(x,y);
  }
  while(a.childNodes.length>bc.length) a.removeChild(a.lastChild);
}

  if(v.status==="running"&&!v.events.some(e=>e.k==="text"||e.k==="tool"))h+=`<div class="typing2" style="--c:${c}" data-key="ty"><i></i><i></i><i></i></div>`;

function spark(h,color,H=38){if(!h||h.length<2)return `<svg class="sp" style="height:${H}px"></svg>`;const v=h.map(x=>x[0]);const m=Math.max(...v,1);const w=300;
  const pts=v.map((y,i)=>`${(i/(v.length-1)*w).toFixed(1)},${(H-2-(y/m)*(H-6)).toFixed(1)}`).join(" ");
  return `<svg class="sp" style="height:${H}px" viewBox="0 0 ${w} ${H}" preserveAspectRatio="none"><polyline points="0,${H} ${pts} ${w},${H}" style="fill:${color};fill-opacity:.12;stroke:none"/><polyline points="${pts}" style="fill:none;stroke:${color};stroke-width:1.6" vector-effect="non-scaling-stroke"/></svg>`}

function expected(k){const d=[];(S.collab||[]).forEach(x=>x.tasks.forEach(t=>{if(t.agent===k&&t.status==="done"&&t.started&&t.finished)d.push(t.finished-t.started)}));return d.length?d.reduce((a,b)=>a+b,0)/d.length*1000:30000}

function callChips(docs){
  const now=Date.now()/1000,out=[];
  docs.forEach(d=>d.tasks.forEach(t=>{
    const recent=t.finished&&now-t.finished<8;
    if(t.status==="running"||(t.status==="failed"&&recent)||(t.status==="done"&&recent)) out.push({d,t})}));
  if(!out.length) return "";
  return `<div class="calls">`+out.map(({d,t})=>{
    const st=t.status==="running"?"running":t.status==="done"?"done":"error";
    const exp=expected(t.agent),el=((t.finished||now)-(t.started||now))*1000;
    const icon=st==="running"?`<svg class="spin" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">${I.loader}</svg>`:st==="done"?ic("check",16):ic("x",16);
    return `<div class="cc ${st}" data-key="cc-${t.id}-${st}" style="--c:${hex(t.agent)};color:${hex(t.agent)}">
      <div class="pg" data-started="${t.started||now}" data-exp="${exp}" data-st="${st}" style="width:${st==="running"?Math.min(94,el/exp*94).toFixed(1):100}%"></div><div class="wash"></div>
      <div class="ic">${icon}</div>
      <div class="tx"><span class="nm" style="color:var(--text)">${esc(aname(t.agent))}</span><span class="arg">${esc((t.section||"whole doc")+" · "+t.instruction)}</span></div>
      ${st==="error"?`<span class="err" title="${esc(t.error)}">${esc(t.error)}</span><button class="btn sm" data-act="retry" data-doc="${esc(d.doc)}" data-id="${t.id}">${ic("retry",12)} retry</button>`:""}
      <span class="tm" data-t0="${t.started||now}" data-t1="${st==="running"?"":t.finished}">${(el/1000).toFixed(1)}s</span></div>`}).join("")+`</div>`}

const sum=(arr,f)=>arr.reduce((x,a)=>x+(+f(a)||0),0);

function vOverview(){

    if(a.listen.length) rows.push(`<tr data-key="l-${a.key}"><td style="color:${a.hex};font-weight:600">${esc(a.name)}</td><td style="color:var(--warn)">listening</td><td></td><td class="m">${a.listen.join(", ")}</td></tr>`)});
  let h=`<div class="ph"><h1>Network</h1><span class="sub">live connections by provider</span></div>`;
  return h+(rows.length?`<div class="panel"><table><thead><tr><th>agent</th><th>provider</th><th class="r">conns</th><th>endpoint</th></tr></thead><tbody>${rows.join("")}</tbody></table></div>`:`<div class="empty">No agent network activity right now.</div>`)}

function vNew(){
  return `<div class="ph"><h1>New shared document</h1><span class="sub">describe a goal and let a planner split it, or set up the sections yourself</span></div>
  <div class="panel" data-static data-key="planform"><h2>✦ Plan it for me</h2>
    <textarea id="pgoal" placeholder="e.g. a launch plan for the v2 pricing page, or the design for a Next.js todo app with auth"></textarea>
    <div class="row" style="margin-top:8px"><input id="pdoc" placeholder="save as (optional), e.g. ~/notes/todo-app.md or Vault:Projects/Todo" style="flex:1"><label class="muted" style="font-size:12.5px;display:flex;gap:6px;align-items:center"><input type="checkbox" id="prunnow"> start agents right away</label><button class="btn pri" data-act="plan">Plan</button></div>
    <div id="pwho" style="margin-top:10px"></div></div>
  <div class="cols"><div class="panel" data-static data-key="newform"><div style="display:grid;gap:8px">
    <input id="npath" placeholder="path — ~/docs/launch.md or Vault:Projects/Launch">
    <input id="ntitle" placeholder="title">
    <input id="nsecs" placeholder="sections — Goals, Architecture, Risks, Timeline">
    <div class="row"><button class="btn pri" data-act="create">${ic("plus",14)} Create</button></div>
    <h3>or open an existing file</h3>
    <div class="row"><input id="opath" placeholder="~/notes/plan.md" style="flex:1" list="vlist"><datalist id="vlist"></datalist><button class="btn" data-act="openfile">Open</button></div>
  </div></div><div class="panel"><h2>How it works</h2><div class="muted" style="font-size:13px;line-height:1.7">
  Each AI gets the whole document for context and writes only its own section. Section tasks run in parallel; whole-document passes run after them.
  Every write is backed up, so undo steps back one write at a time.<br><br>In Obsidian you can assign work from inside a note:<div class="doc" style="margin-top:8px">## Architecture\n&gt; [!ai] codex\n&gt; describe the services</div></div></div></div>`}

function vDoc(path){
  const d=docData&&docData.doc===path?docData:null;
  const ov=(S.collab||[]).find(x=>x.doc===path)||{doc:path,tasks:[]};
  const tasks=d?d.tasks:ov.tasks;
  const name=path.split("/").pop();
  let h=`<div class="ph"><h1>${esc(name.replace(/\.md$/,""))}</h1><span class="sub">${esc(path)}${d&&d.vault?" · vault "+esc(d.vault):""}</span><div class="grow"></div>
    ${d&&d.obsidian?`<a class="btn" href="${esc(d.obsidian)}">Open in Obsidian</a>`:""}
    <button class="btn" data-act="sync" title="turn > [!ai] callouts into tasks">${ic("wand",14)} Callouts</button>
    <button class="btn" data-act="undo">${ic("undo",14)} Undo</button>
    <button class="btn pri" data-act="run">${ic("play",13)} Run pending</button></div>`;
  h+=callChips([{doc:path,tasks}]);
  const secs=d?d.sections:[];
  h+=`<div class="cols"><div>
   <div class="panel" data-static data-key="assign-${esc(path)}"><h2>Assign work</h2><div style="display:grid;gap:8px">
     <select id="asec"></select>
     <div class="row"><select id="aag" style="flex:1">${agentsList.map(a=>`<option value="${a.key}">${esc(a.name)}${a.installed?"":" (not installed)"}</option>`).join("")}</select><input id="amodel" placeholder="model (optional)" style="flex:1"></div>
     <textarea id="ainst" placeholder="What should this AI write?"></textarea>
     <div class="row"><button class="btn pri" data-act="assign">Assign</button></div></div></div>
   <div class="panel"><h2>Tasks <span class="muted" style="font-weight:400">${tasks.filter(t=>t.status==="done").length}/${tasks.length}</span></h2>
   ${tasks.length?tasks.map(t=>{if(!seenTask.has(t.id)){seenTask.add(t.id);if(t.status==="done")quiet.add(t.id)}if(t.status!=="done")quiet.delete(t.id);return `<div class="sc ${t.status} ${quiet.has(t.id)?"quiet":""}" data-key="t-${t.id}" style="--c:${hex(t.agent)}">
      <button class="box" data-act="${t.status==="done"?"reopen":"runone"}" data-id="${t.id}" title="${t.status==="done"?"reopen":"run now"}"><svg width="14" height="14" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></button>
      <div class="bd"><div class="t">${esc(t.instruction)}</div>
      <div class="meta"><b>${esc(aname(t.agent))}</b>${t.model?`<span class="chip">${esc(t.model)}</span>`:""}<span class="muted">→ ${esc(t.section||"whole document")}</span><span class="muted">${t.status==="done"&&t.started?Math.round(t.finished-t.started)+"s":t.status==="pending"?"pending":""}</span><div class="grow"></div>
      <span class="acts">${t.status!=="running"?`<button class="btn sm" data-act="retry" data-doc="${esc(path)}" data-id="${t.id}">${ic("retry",11)}</button><button class="btn sm" data-act="rm" data-id="${t.id}">${ic("x",11)}</button>`:""}</span></div>
      ${t.error&&t.status==="failed"?`<div class="e">${esc(t.error)}</div>`:""}</div></div>`}).join(""):`<div class="muted">No tasks yet. Pick a section, pick an AI, describe the job.</div>`}</div>
  </div><div class="panel"><div class="doc" id="dtext">${d?docHTML(d):"loading…"}</div></div></div>`;
  return h}

function docHTML(d){
  const owners={};d.tasks.filter(t=>t.status==="done"&&t.section).forEach(t=>owners[t.section.toLowerCase()]=t.agent);
  let cur=null;
  return d.text.split("\n").map(line=>{const m=line.match(/^(#{1,6})\s+(.*?)\s*#*\s*$/);if(m){cur=owners[m[2].toLowerCase()]||null;return `<div class="ln"><span class="hd">${esc(line)}</span>${cur?` <span class="chip" style="color:${hex(cur)}">${esc(aname(cur))}</span>`:""}</div>`}
    return `<div class="ln ${cur?"own":""}" ${cur?`style="--c:${hex(cur)}"`:""}>${esc(line)||"&nbsp;"}</div>`}).join("")}

function syncSections(){
  const s=$("#asec");if(!s||!docData)return;
  const opts=`<option value="">⟨whole document⟩ — runs after sections</option>`+docData.sections.map(x=>`<option value="${esc(x.title)}">${"· ".repeat(Math.max(0,x.level-1))}${esc(x.title)}</option>`).join("");
  if(s._o!==opts){const k=s.value;s.innerHTML=opts;s._o=opts;s.value=k}}

function render(){
  if(!S){$("#view").innerHTML=`<div class="empty">collecting…</div>`;return}
  const sy=S.system;
  morph($("#sys"),`<div class="row" style="justify-content:space-between"><span>${esc(S.host)}</span><span>${(S.agents||[]).filter(a=>a.running).length} live</span></div>
   <div class="row" style="justify-content:space-between"><span>cpu</span><span>${sy.cpu.toFixed(0)}%</span></div><div class="meter"><i style="width:${Math.min(100,sy.cpu)}%"></i></div>
   <div class="row" style="justify-content:space-between"><span>ram</span><span>${hb(sy.mem_used)} / ${hb(sy.mem_total)}</span></div><div class="meter"><i style="width:${(sy.mem_used/sy.mem_total*100).toFixed(1)}%"></i></div>`);
  $("#ver").textContent="v"+S.version;
  renderNav();
  let html;
  if(view==="overview") html=vOverview();
  else if(view.startsWith("agent:")) html=vAgent(view.slice(6));
  else if(view==="mcp") html=vMCP();
  else if(view==="skills") html=vSkills();
  else if(view==="usage") html=vUsage();
  else if(view==="network") html=vNet();
  else if(view==="new") html=vNew();
  else if(view==="local") html=vLocal();
  else if(view==="keys") html=vKeys();
  else if(view==="settings") html=vSettings();
  else if(view==="heal") html=vHeal();
  else if(view==="phone") html=vPhone();
  else if(view==="search") html=vSearch();
  else if(view.startsWith("watch:")) html=vWatch();
  else if(view==="prompt") html=vPrompt();
  else if(view.startsWith("run:")) html=vRun(view.slice(4));
  else if(view.startsWith("doc:")) html=vDoc(view.slice(4));
  else html=vOverview();
  const main=$("#view");
  if(main._v!==view||FORCE){const first=main._v!==view;main.innerHTML=html;main._v=view;FORCE=false;if(first)bindView()}else morph(main,html);
  syncSections();syncLocal();syncComposer();syncMCP();syncSK();syncHeal();
  if(view.startsWith("run:"))document.querySelectorAll(".tb").forEach(tb=>{if(tb._n!==tb.childElementCount){const stick=!tb._n||tb.scrollHeight-tb.scrollTop-tb.clientHeight<120;tb._n=tb.childElementCount;if(stick)tb.scrollTop=tb.scrollHeight}});
}

function bindView(){
  const sq=$("#sq");if(sq){sq.value=skillQ;sq.oninput=()=>{skillQ=sq.value;render()}}
  if(view==="new"){getJSON("/api/planner",{}).then(d=>{const el=$("#pwho");if(!el)return;if(d.error||!d.pick){el.innerHTML=`<span class="muted" style="font-size:12px">${esc(d.error||"planner unavailable")}</span>`;return}
    const pid=`${d.pick.agent}:${d.pick.model||""}`;const opts=(d.options||[]).map(o=>`<option value="${esc(o.agent+":"+(o.model||""))}" ${o.agent+":"+(o.model||"")===pid?"selected":""}>${esc(aname(o.agent))}${o.model?" · "+esc(o.model):""} (${esc(o.where)})${o.agent+":"+(o.model||"")===pid?" · recommended":""}</option>`).join("");
    el.innerHTML=`<div style="font-size:13px">This is the best model we found to plan: <b>${esc(aname(d.pick.agent))}${d.pick.model?" · "+esc(d.pick.model):""}</b> <span class="muted">(${esc(d.pick.where)})</span>. Want another one?</div>
      <div class="row" style="margin-top:6px"><select id="pplanner" style="flex:1;max-width:520px">${opts}</select><label class="muted" style="font-size:12.5px;display:flex;gap:6px;align-items:center"><input type="checkbox" id="premember"> remember</label></div>
      <div class="muted" style="font-size:12px;margin-top:6px">${esc(d.role)} Workers: ${d.workers.map(k=>esc(aname(k))).join(", ")}.</div>`})}
  if(view==="new"){fetch("/api/collab").then(r=>r.json()).then(l=>{const v=$("#vlist");if(v)v.innerHTML=(l.vaults||[]).map(x=>`<option value="${esc(x.name)}:">${esc(x.path)}</option>`).join("")})}
  if(view.startsWith("doc:")) loadDoc();
  if(view==="mcp")loadMX();
  if(view==="skills")loadSKM();
  if(view==="settings")loadSettings();
  if(view==="phone")loadPhone();
  if(view==="search"){const q=$("#srq");if(q){q.value=SR.q;q.focus();q.oninput=()=>{SR.q=q.value;clearTimeout(SR.t);SR.t=setTimeout(doSearch,280)};q.onkeydown=e=>{if(e.key==="Enter"){clearTimeout(SR.t);doSearch()}}}
    const ag=$("#sra");if(ag){ag.value=SR.agent;ag.onchange=()=>{SR.agent=ag.value;doSearch()}}const sn=$("#srs");if(sn){sn.value=SR.since;sn.onchange=()=>{SR.since=sn.value;doSearch()}}}
  if(view==="heal")loadHeal().then(()=>{FORCE=true;render()});
  if(view==="keys")loadKeys().then(()=>{FORCE=true;render()});
  if(view==="prompt"){loadRuns().then(render);setTimeout(()=>{const q=$("#pq");if(q)q.focus()},30)}
  if(view.startsWith("run:"))loadRun(view.slice(4));
  if(view.startsWith("watch:")){W={key:view,data:null,pick:null,prev:null,pvOrigin:null,pvPort:null,focusKey:null,sel:null};loadWatch()}
}

function go(v){view=v;localSet("view",v);docData=null;history.replaceState(null,"","#"+encodeURIComponent(v));render();scrollTo(0,0)}

async function loadDoc(){
  if(!view.startsWith("doc:"))return;
  const path=view.slice(4);
  const r=await fetch("/api/collab?doc="+encodeURIComponent(path));
  if(!r.ok){toast("Document not found");return}
  docData=await r.json();
  if(view==="doc:"+path) render()}

document.addEventListener("click",async e=>{
  const el=e.target.closest("[data-act]");if(!el)return;
  const act=el.dataset.act,doc=view.startsWith("doc:")?view.slice(4):null;
  try{
    if(act==="go"){document.querySelector("aside").classList.remove("open");return go(el.dataset.v)}
    if(act==="fold"){const g=el.dataset.g;open.has(g)?open.delete(g):open.add(g);localSet("open",JSON.stringify([...open]));return renderNav()}
    if(act==="kill"){if(!confirm("Send SIGTERM to "+el.dataset.pid+"?"))return;await post("/api/kill",{pid:+el.dataset.pid});return toast("Signal sent")}
    if(act==="plan"){const goal=$("#pgoal").value.trim();if(!goal)return toast("Describe the goal first");el.disabled=true;el.textContent="Planning…";
      try{const sel=$("#pplanner");const r=await post("/api/plan",{goal,doc:$("#pdoc").value.trim(),run:$("#prunnow").checked,planner:sel?sel.value:null,remember:!!($("#premember")&&$("#premember").checked)});toast(`${r.title}: ${r.tasks} tasks, planned by ${aname(r.planner.agent)}${r.planner.model?" · "+r.planner.model:""}`);await refresh();return go("doc:"+r.doc)}
      finally{el.disabled=false;el.textContent="Plan"}}
    if(act==="create"){const r=await post("/api/collab/new",{doc:$("#npath").value,title:$("#ntitle").value,sections:$("#nsecs").value.split(",")});await refresh();return go("doc:"+r.doc)}
    if(act==="openfile"){const r=await post("/api/collab/open",{doc:$("#opath").value});await refresh();return go("doc:"+r.doc)}
    if(act==="assign"){const inst=$("#ainst").value.trim();if(!inst)return toast("Write an instruction");
      await post("/api/collab/assign",{doc,section:$("#asec").value,agent:$("#aag").value,model:$("#amodel").value,instruction:inst});$("#ainst").value="";toast("Assigned");return loadDoc()}
    if(act==="run"){await post("/api/collab/run",{doc});toast("Agents are writing…");return setTimeout(loadDoc,300)}
    if(act==="runone"){await post("/api/collab/reset",{doc,id:el.dataset.id});await post("/api/collab/run",{doc,ids:[el.dataset.id]});return setTimeout(loadDoc,300)}
    if(act==="retry"){const d=el.dataset.doc||doc;await post("/api/collab/reset",{doc:d,id:el.dataset.id});await post("/api/collab/run",{doc:d,ids:[el.dataset.id]});toast("Retrying");return setTimeout(loadDoc,300)}
    if(act==="reopen"){await post("/api/collab/reset",{doc,id:el.dataset.id});return loadDoc()}
    if(act==="rm"){await post("/api/collab/remove",{doc,id:el.dataset.id});return loadDoc()}
    if(act==="undo"){const r=await post("/api/collab/undo",{doc});toast(r.ok?"Restored previous version":"Nothing to undo");return loadDoc()}
    if(act==="pag"){const k=el.dataset.k;P.agents=P.agents.includes(k)?P.agents.filter(x=>x!==k):[...P.agents,k];saveP();return syncComposer()}
    if(act==="mpre"){$("#mpaste").value=el.dataset.line;$("#mname").value=el.dataset.name;return}
    if(act==="mtg"){const k=el.dataset.k;MSEL=MSEL.includes(k)?MSEL.filter(x=>x!==k):[...MSEL,k];return syncMCP()}
    if(act==="mtest"){const text=$("#mpaste").value.trim();if(!text)return toast("Paste a command, URL or JSON first");const out=$("#mres");out.innerHTML=`<span class="muted typing">starting it and asking for its tools</span>`;
      const r=await post("/api/mcp/test",{text});return showTest(out,r,$("#mname").value)}
    if(act==="madd"){const text=$("#mpaste").value.trim();if(!text)return toast("Paste a command, URL or JSON first");if(!MSEL.length)return toast("Pick at least one agent");
      const r=await post("/api/mcp/add",{text,name:$("#mname").value.trim(),agents:MSEL});const errs=Object.entries(r.errors);
      $("#mres").innerHTML=`<span style="color:var(--good)">✓ added ${esc(r.name)} to ${r.done.map(aname).join(", ")||"nothing"}</span>${errs.length?` · <span style="color:var(--bad)">${errs.map(([k,v])=>esc(aname(k)+": "+v)).join(" · ")}</span>`:""} <span class="muted">· restart running agents to load it</span>`;
      $("#mpaste").value="";$("#mname").value="";return loadMX()}
    if(act==="mcell"){const on=el.dataset.on==="1",name=el.dataset.name,ag=el.dataset.ag;
      if(on&&!confirm(`Remove ${name} from ${aname(ag)}?`))return;el.classList.add("busy");
      const r=await post(on?"/api/mcp/remove":"/api/mcp/copy",on?{name,agents:[ag]}:{name,from:el.dataset.src,agents:[ag]});
      const e=Object.values(r.errors)[0];toast(e?aname(ag)+": "+e:`${on?"Removed":"Added"} ${name} ${on?"from":"to"} ${aname(ag)} · restart it to apply`);return loadMX()}
    if(act==="mall"){const r=await post("/api/mcp/copy",{name:el.dataset.name,from:el.dataset.src,agents:el.dataset.to.split(",")});toast(`Added ${el.dataset.name} to ${r.done.length} agents`);return loadMX()}
    if(act==="mrm"){if(!confirm(`Remove ${el.dataset.name} from every agent?`))return;await post("/api/mcp/remove",{name:el.dataset.name,agents:el.dataset.ags.split(",")});toast("Removed");return loadMX()}
    if(act==="mrowtest"){const out=$("#mrowres");out.innerHTML=`<span class="muted typing">testing ${esc(el.dataset.name)}</span>`;const r=await post("/api/mcp/test",{name:el.dataset.name,from:el.dataset.src});return showTest(out,r,el.dataset.name)}
    if(act==="skpre"){$("#sksrc").value=el.dataset.src;return document.querySelector("[data-act=skfind]").click()}
    if(act==="sktg"){const k=el.dataset.k;SKSEL=SKSEL.includes(k)?SKSEL.filter(x=>x!==k):[...SKSEL,k];return syncSK()}
    if(act==="skfind"){const src=$("#sksrc").value.trim();if(!src)return toast("Paste a source first");const box=$("#skfound");box.innerHTML=`<span class="muted typing">looking for SKILL.md files</span>`;
      try{SKF=await post("/api/skills/fetch",{source:src})}catch(err){box.innerHTML="";throw err}
      box.innerHTML=`<div class="muted" style="font-size:12px;margin-bottom:6px">${SKF.skills.length} found · <a data-act="skall" style="cursor:pointer">select all</a></div><div style="display:grid;gap:4px;max-height:280px;overflow:auto">`+SKF.skills.map(x=>`<label style="display:flex;gap:8px;align-items:baseline;font-size:13px"><input type="checkbox" class="skpick" value="${esc(x.folder)}" ${SKF.skills.length===1?"checked":""}><b>${esc(x.name)}</b><span class="muted" style="font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(x.description)}</span></label>`).join("")+`</div><div class="row" style="margin-top:8px"><button class="btn pri" data-act="skinstall">Install selected</button></div>`;return}
    if(act==="skall"){document.querySelectorAll(".skpick").forEach(c=>c.checked=true);return}
    if(act==="skinstall"){const names=[...document.querySelectorAll(".skpick:checked")].map(c=>c.value);if(!names.length)return toast("Pick at least one skill");if(!SKSEL.length)return toast("Pick at least one agent");
      const r=await post("/api/skills/install",{id:SKF.id,names,agents:SKSEL});toast(`Installed ${names.length} skill${names.length>1?"s":""} into ${SKSEL.length} agent${SKSEL.length>1?"s":""} · restart agents to load them`);$("#skfound").innerHTML="";return loadSKM()}
    if(act==="sknew"){const name=$("#sknm").value.trim();if(!name)return toast("Name it first");if(!SKSEL.length)return toast("Pick at least one agent");
      await post("/api/skills/create",{name,description:$("#skds").value,body:$("#skbd").value,agents:SKSEL});toast("Skill created");$("#sknm").value=$("#skds").value=$("#skbd").value="";return loadSKM()}
    if(act==="skcell"){const on=el.dataset.on==="1";if(on&&!confirm(`Remove ${el.dataset.f} from ${aname(el.dataset.ag)}?`))return;
      await post(on?"/api/skills/remove":"/api/skills/copy",on?{folder:el.dataset.f,agents:[el.dataset.ag]}:{folder:el.dataset.f,from:el.dataset.src,agents:[el.dataset.ag]});return loadSKM()}
    if(act==="skrm"){if(!confirm(`Remove ${el.dataset.f} from every agent? A backup is kept.`))return;await post("/api/skills/remove",{folder:el.dataset.f,agents:el.dataset.ags.split(",")});return loadSKM()}
    if(act==="hdetect"){const cwd=$("#hcwd").value.trim();if(!cwd)return toast("Pick a folder first");const d=await loadHeal(cwd);
      if(d&&d.detect&&!$("#hcmd").value)$("#hcmd").value=d.live||d.detect;$("#hinfo").textContent=d&&d.live?`Live self-heal is on here: \`${d.live}\` runs when Claude Code finishes.`:d&&d.detect?`Suggested from the project files.`:`Couldn't guess a check for this folder, type one.`;return}
    if(act==="hrun"){const cwd=$("#hcwd").value.trim(),cmd=$("#hcmd").value.trim();if(!cwd)return toast("Pick a folder first");
      if($("#hmode").value==="auto"&&!confirm("Auto lets the agent run commands without asking. Continue?"))return;
      try{await post("/api/heal",{cwd,cmd,agent:$("#hag").value,tries:+$("#htries").value,mode:$("#hmode").value});toast("Self-heal started");await loadHeal();FORCE=true;return render()}catch(err){return toast(err.message)}}
    if(act==="hlive"){const cwd=$("#hcwd").value.trim(),cmd=$("#hcmd").value.trim();if(!cwd||!cmd)return toast("Pick a folder and a check command");
      await post("/api/heal/live",{cwd,cmd});return toast("Live self-heal on: Claude Code sessions in this folder now fix failing checks before stopping")}
    if(act==="hstop"){await post("/api/heal/stop",{id:el.dataset.id});await loadHeal();FORCE=true;return render()}
    if(act==="sbtest"){const o=$("#sbres");o.innerHTML=`<span class="muted typing">starting the container</span>`;const r=await post("/api/sandbox/test",{});o.innerHTML=`<span style="color:${r.ok?"var(--good)":"var(--bad)"}">${r.ok?"✓":"✗"}</span> ${esc(r.output)}`;return}
    if(act==="setsave"){const values={};SET.sections.forEach(sec=>{values[sec.id]={};sec.fields.forEach(f=>{const el2=$(`#set-${sec.id}-${f.name}`);if(!el2)return;values[sec.id][f.name]=f.type==="bool"?el2.checked:el2.value})});
      SET=Object.assign(await post("/api/settings",{values}),{hooks:SET.hooks});toast("Settings saved");loadKeys();FORCE=true;return render()}
    if(act==="setraw"){SET=Object.assign(await post("/api/settings",{raw:$("#setrawt").value}),{hooks:SET.hooks});toast("config.toml saved");FORCE=true;return render()}
    if(act==="sethooks"){const r=await post("/api/hooks",{on:el.dataset.on==="1"});SET.hooks=r.hooks;toast(r.hooks?"Hooks on · restart running Claude sessions":"Hooks off");FORCE=true;return render()}
    if(act==="setauto"){const r=await post("/api/autostart",{on:el.dataset.on==="1",relay:true});return toast(r.message)}
    if(act==="keysave"||act==="keyrm"){const pr=el.dataset.p;const v=act==="keyrm"?"":($("#key-"+pr).value||"").trim();if(act==="keysave"&&!v)return toast("Paste a key first");
      if(act==="keyrm"&&!confirm("Remove this key from nyrasview's config?"))return;const r=await post("/api/keys",{provider:pr,key:v});KEYS=r.status;toast(act==="keyrm"?"Key removed":"Key saved");FORCE=true;return render()}
    if(act==="calib"){const r=await post("/api/runs",{agents:["claude"],prompt:"Reply with just: ok",cwd:"~",mode:"ask",model:"haiku"});toast("Calibrating… the gauge fills in a few seconds");return}
    if(act==="bnotify"){const p=await Notification.requestPermission();if(p==="granted"){localSet("bnotify","1");toast("Browser alerts on")}else toast("Browser blocked notifications");return render()}
    if(act==="pmore"){P.more=!P.more;return syncComposer()}
    if(act==="pmode"){P.mode=el.dataset.m;saveP();return syncComposer()}
    if(act==="prun"){const prompt=$("#pq").value.trim();if(!prompt)return toast("Write a prompt first");if(!P.agents.length)return toast("Pick at least one agent");
      if(P.mode==="auto"&&!confirm("Auto mode lets the agent run commands and change files without asking. Continue?"))return;
      const r=await post("/api/runs",{agents:P.agents,prompt,cwd:$("#pcwd").value.trim()||"~",mode:P.mode,model:$("#pmodel").value.trim(),sandbox:$("#psb")&&$("#psb").style.display!=="none"?$("#psbc").checked:null,api:!!($("#papic")&&$("#papic").checked&&$("#papi").style.display!=="none")});
      const bad=r.runs.filter(x=>x.status==="failed");if(bad.length)toast(bad.map(x=>aname(x.agent)+": "+x.error).join(" · "));
      $("#pq").value="";await loadRuns();return go("run:"+r.runs[0].id)}
    if(act==="pterm"){const k=P.agents[0];if(!k)return toast("Pick an agent");const r=await post("/api/open",{agent:k,cwd:$("#pcwd").value.trim()||"~",prompt:$("#pq").value});return toast(`Opened ${aname(k)} in ${r.terminal}`)}
    if(act==="psay"){const text=$("#pq").value.trim();if(!text)return toast("Write something first");const a=(S.agents||[]).find(x=>x.key===P.agents[0]);const w=(a.work||[]).find(x=>!x.collab&&x.cwd);
      const it=await post("/api/feedback",{agent:a.key,cwd:w.cwd,text});$("#pq").value="";return toast(it.status==="copied"?"Copied to clipboard: paste it into the session":"Sent: it arrives after its next step")}
    if(act==="pstop"){for(const id of el.dataset.ids.split(","))await post("/api/runs/stop",{id});toast("Stopped");return loadRun(view.slice(4))}
    if(act==="pfollow"){const id=el.dataset.id,ta=$("#fu-"+id),text=ta.value.trim();if(!text)return;const v=RUNV[id];
      const r=await post("/api/runs",{agents:[v.agent],prompt:text,cwd:v.cwd,mode:v.mode,model:v.model,parent:id});ta.value="";await loadRuns();return go("run:"+r.runs[0].id)}
    if(act==="pfor"){P.agents=[el.dataset.agent];if(el.dataset.cwd)P.cwd=el.dataset.cwd;saveP();go("prompt");const cw=$("#pcwd");if(cw){cw.value=P.cwd}return}
    if(act==="tcx"){el.classList.toggle("open");return}
    if(act==="watch") return go("watch:"+el.dataset.agent+":"+el.dataset.cwd);
    if(act==="wpick"){W.pick=+el.dataset.i;W.focusKey=null;return loadWatch()}
    if(act==="wlatest"){W.pick=null;W.focusKey=null;return loadWatch()}
    if(act==="line"){const n=+el.dataset.n;const s0=e.shiftKey&&W.sel?Math.min(W.sel[0],n):n,s1=e.shiftKey&&W.sel?Math.max(W.sel[1],n):n;return openCodeBubble(s0,s1,el)}
    if(act==="csend"){const text=$("#cbubt").value.trim();if(!text)return;const {agent:ag,cwd}=watchParts();const f=W.data&&W.data.focus;
      const it=await post("/api/feedback",{agent:ag,cwd,text,target:{file:f&&f.rel,lines:W.sel}});$("#cbubt").value="";$("#cbub").classList.remove("on");W.sel=null;return fbToast(it)}
    if(act==="say"){const text=$("#say").value.trim();if(!text)return;const {agent:ag,cwd}=watchParts();const it=await post("/api/feedback",{agent:ag,cwd,text});$("#say").value="";return fbToast(it)}
    if(act==="hooks"){if(!confirm("Add nyrasview hooks to ~/.claude/settings.json? A backup is saved first. Already-running Claude sessions need a restart to pick it up."))return;await post("/api/hooks/install",{});toast("Live feedback enabled");return loadWatch()}
    if(act==="ton"||act==="tdl"||act==="toff"){const body=act==="toff"?{on:false}:{on:true,download:act==="tdl"};
      if(act!=="toff"){PH=Object.assign(PH||{},{on:true,tunnel:Object.assign((PH&&PH.tunnel)||{},act==="tdl"?{downloading:true}:{starting:true})});FORCE=true;render()}
      try{PH=await post("/api/tunnel",body)}catch(err){toast(err.message)}FORCE=true;render();
      if(act!=="toff"){for(let i=0;i<100&&PH&&PH.tunnel&&!PH.tunnel.url&&(PH.tunnel.starting||PH.tunnel.downloading);i++){await new Promise(r=>setTimeout(r,1500));PH=await getJSON("/api/phone",PH);FORCE=true;render()}}
      return}
    if(act==="tcopy"){try{await navigator.clipboard.writeText(PH.tunnel.link);toast("Copied")}catch(e){toast("Select and copy it manually")}return}
    if(act==="fwcopy"){try{await navigator.clipboard.writeText($("#fwcmd").textContent);toast("Copied")}catch(e){toast("Select and copy it manually")}return}
    if(act==="menu"){document.querySelector("aside").classList.toggle("open");return}
    if(act==="phon"||act==="phoff"||act==="phrot"){if(act==="phrot"&&!confirm("Sign out every phone? You'll scan a new code."))return;PH=await post("/api/phone",act==="phrot"?{rotate:true,on:true}:{on:act==="phon"});FORCE=true;return render()}
    if(act==="gshide"){localSet("gsdone","1");return render()}
    if(act==="gshooks"){if(!confirm("Add nyrasview's hook to ~/.claude/settings.json? A backup is saved. Restart running Claude sessions once afterwards."))return;await post("/api/hooks",{on:true});if(SET0)SET0._hooks=true;toast("Claude Code connected · restart running sessions once");return render()}
    if(act==="hopen"){return openHandoff(el.dataset.agent,el.dataset.cwd)}
    if(act==="srcopy"){const r=SR.res&&SR.res[+el.dataset.i];if(r&&r.resume){try{await navigator.clipboard.writeText(r.resume);toast("Copied: paste it in a terminal")}catch(x){prompt("Copy this:",r.resume)}}return}
    if(act==="rvopen"){const id=el.dataset.id;W.rv=W.rv||{};if(W.rv[id]){delete W.rv[id];return render()}const {cwd}=watchParts();W.rv[id]=await post("/api/review/hunks",{cwd,id});return render()}
    if(act==="rvset"||act==="rvrest"){const id=el.dataset.id;const {cwd}=watchParts();
      const r=act==="rvrest"?await post("/api/review/accept_rest",{cwd,id}):await post("/api/review/decide",{cwd,id,hunk:el.dataset.h,action:el.dataset.a});
      if(r.ok===false)toast(r.message);else if(r.message)toast(r.message);
      W.rv[id]=await post("/api/review/hunks",{cwd,id});render();return loadWatch()}
    if(act==="cpdiff"){const id=el.dataset.id;W.cpd=W.cpd||{};if(W.cpd[id]){delete W.cpd[id];return render()}
      const {cwd}=watchParts();const r=await post("/api/checkpoints/diff",{cwd,id});W.cpd[id]=r.diff||"(no changes)";return render()}
    if(act==="cpundo"){const id=el.dataset.id;const {cwd}=watchParts();const t=((W.data&&W.data.checkpoints||{}).turns||[]).find(x=>x.id===id)||{};
      const chk=await post("/api/checkpoints/undo",{cwd,id,dry:true});
      if(!chk.ok){if(confirm(`${chk.message}${(chk.conflicts||[]).length?" ("+chk.conflicts.join(", ")+")":""}.\n\nRewind the whole repo to just before this turn instead? Everything after it is undone too, and you can undo the rewind.`)){const r=await post("/api/checkpoints/restore",{cwd,id,before:true});toast(r.message)}return loadWatch()}
      if(!confirm(`Undo ${aname(t.agent)}'s turn "${(t.prompt||"").slice(0,80)}"?\n\nReverts ${chk.files.length} file(s): ${chk.files.slice(0,8).join(", ")}\nEverything done after it stays. You can undo this undo.`))return;
      const r=await post("/api/checkpoints/undo",{cwd,id});toast(r.message);return loadWatch()}
    if(act==="hkeys"){$("#hmodal").classList.remove("on");return go("keys")}
    if(act==="hclose"){$("#hmodal").classList.remove("on");return}
    if(act==="hpick"){HO.pick=el.dataset.k;return drawHandoff()}
    if(act==="hgo"||act==="hwrite"){const r=await post("/api/handoff",{agent:HO.agent,cwd:HO.cwd,to:HO.pick,write_only:act==="hwrite"});$("#hmodal").classList.remove("on");
      return toast(act==="hwrite"?`Wrote ${r.path.replace(HOMERE,"~")}`:`Handed off to ${(HO.data.targets.find(t=>t.key===r.to)||{}).name||r.to} · opened in ${r.terminal}`)}
    if(act==="handoff"){const sel=el.dataset.pick?document.querySelector(`[data-hsel="${el.dataset.pick}"]`):null;const to=sel?sel.value:el.dataset.to;
      if(!confirm(`Write .nyrasview/HANDOFF.md in ${el.dataset.cwd} and open ${to} with it?`))return;
      const r=await post("/api/handoff",{agent:el.dataset.agent,cwd:el.dataset.cwd,to});return toast(`Handed off to ${r.to} · opened in ${r.terminal}`)}
    if(act==="lask"){const pr=$("#lprompt").value.trim();if(!pr)return;const out=$("#lreply");out.innerHTML=`<span class="muted typing">thinking</span>`;$("#lmeta").textContent="";
      const t0=performance.now();const r=await post("/api/local/chat",{server:$("#lsrv").value,model:$("#lmod").value,prompt:pr});
      $("#lmeta").textContent=r.model+" · "+((performance.now()-t0)/1000).toFixed(1)+"s";out.textContent="";out.classList.add("typing");
      let i=0;const step=Math.max(1,Math.ceil(r.text.length/90));(function type(){i+=step;out.textContent=r.text.slice(0,i);if(i<r.text.length)requestAnimationFrame(type);else out.classList.remove("typing")})();return}
    if(act==="sync"){const r=await post("/api/collab/sync",{doc,run:true});toast(r.tasks.length?r.tasks.length+" callout task(s) running":"No [!ai] callouts in this note");return setTimeout(loadDoc,300)}
  }catch(err){toast(err.message)}
});

function tick(){
  const now=Date.now()/1000;
  document.querySelectorAll(".cc .tm").forEach(t=>{const t0=+t.dataset.t0,t1=+t.dataset.t1||now;t.textContent=Math.max(0,t1-t0).toFixed(1)+"s"});
  document.querySelectorAll(".cc .pg").forEach(p=>{if(p.dataset.st!=="running")return;const el=(now-+p.dataset.started)*1000,exp=+p.dataset.exp;const f=1-Math.exp(-el/exp*1.6);p.style.width=(f*96).toFixed(2)+"%"});
  requestAnimationFrame(tick)}

async function refresh(){try{S=await (await fetch("/api/snapshot")).json();paint(S.agents);setHome(S.home)}catch(e){}}
async function poll(){await refresh();await loadRuns();await loadEvents();if(view==="heal"||HEAL.some(j=>!["passed","failed","stopped"].includes(j.status)))await loadHeal();if(view.startsWith("run:")){const v=RUNV[view.slice(4)];if(!v||[view.slice(4),...(v.siblings||[])].some(x=>!RUNV[x]||RUNV[x].status==="running"))await loadRun(view.slice(4))}render();if(view.startsWith("doc:"))loadDoc();if(view.startsWith("watch:"))loadWatch();setTimeout(poll,1500)}

{const h=decodeURIComponent(location.hash.slice(1));if(h)view=h;if(view.startsWith("search:")){SR.q=view.slice(7);view="search";setTimeout(doSearch,0)}}
if(STALE)$("#stale").innerHTML=`<div class="hookbar">⚠ nyrasview was updated since this server started. Restart it to get the new features: press Ctrl+C where <code>nyrasview gui</code> runs, then run it again.</div>`;
loadRuns().then(()=>{renderNav()});
getJSON("/api/agents",[]).then(l=>{agentsList=l;paint(agentsList);if(view==="prompt")syncComposer();if(view.startsWith("doc:")){FORCE=true;render()}});
render();bindView();
requestAnimationFrame(tick);
setTimeout(poll,1500);
</script>
